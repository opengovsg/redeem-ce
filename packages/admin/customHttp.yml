customHeaders:
  - pattern: '**'
    headers:
      - key: 'Content-Security-Policy'
        value: "frame-ancestors 'none'"
      - key: 'X-Frame-Options'
        value: 'DENY' # SAMEORIGIN should be sufficient but DENY as frame-ancestors is none anyway
      - key: 'X-Permitted-Cross-Domain-Policies'
        value: 'none'
      - key: 'Referrer-Policy'
        value: 'no-referrer'
